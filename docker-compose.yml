# ============================================================
# MCP-Sentinel – Production-Hardened Multi-Container Stack
#   postgres  : PostgreSQL 16 (isolated internal network)
#   api       : FastAPI backend on port 8000 with health/live probe
#   web       : Next.js security console on port 3000
#   prometheus: Optional metrics aggregator on port 9090
# ============================================================

services:
  # ----------------------------------------------------------
  # PostgreSQL 16 Database
  # ----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mcp_sentinel_db}
    # Secure: Bind strictly to localhost loopback for local dev; never expose to 0.0.0.0
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-mcp_sentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - sentinel-net

  # ----------------------------------------------------------
  # FastAPI Backend API (MCP-Sentinel Core)
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: sentinel-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-mcp_sentinel_db}
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MCP_SERVER_NAME: MCP-Sentinel
      MCP_SERVER_VERSION: 1.0.0-rc.1
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sentinel-prod-key-must-be-rotated-min-32chars}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ENABLE_TEST_AUTH: ${ENABLE_TEST_AUTH:-false}
      MAX_AGENT_ITERATIONS: ${MAX_AGENT_ITERATIONS:-10}
      MAX_TOOL_CALLS: ${MAX_TOOL_CALLS:-15}
      APPROVAL_TICKET_TTL_SECONDS: ${APPROVAL_TICKET_TTL_SECONDS:-3600}
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  # ----------------------------------------------------------
  # Next.js Security Console Frontend
  # ----------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: sentinel-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - sentinel-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

# ----------------------------------------------------------
# Isolated Shared Bridge Network
# ----------------------------------------------------------
networks:
  sentinel-net:
    driver: bridge

# ----------------------------------------------------------
# Persistent Volumes
# ----------------------------------------------------------
volumes:
  postgres_data:
    driver: local
