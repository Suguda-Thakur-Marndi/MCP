[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentinel"
version = "1.0.0-rc.1"
description = "Production-grade secure MCP server with Human-in-the-Loop approval gating."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.0,<5.0.0",
    "mcp>=2.2.0,<3.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "pydantic-settings>=2.7.0,<3.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pyjwt>=2.9.0,<3.0.0",
    "cryptography>=42.0.0,<44.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8.0,<1.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
