[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sentinel"
version = "1.0.0-rc.1"
description = "Production-grade secure MCP server with Human-in-the-Loop approval gating."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.0",
    "mcp>=2.2.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "langgraph>=1.2.0",
    "google-genai>=2.20.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pyjwt>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
