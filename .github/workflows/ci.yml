name: MCP-Sentinel CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: ci_test_password
  POSTGRES_DB: mcp_sentinel_test
  DATABASE_URL: postgresql://postgres:ci_test_password@localhost:5432/mcp_sentinel_test
  APP_ENV: test
  ENABLE_TEST_AUTH: "true"
  JWT_SECRET_KEY: ci-test-jwt-secret-key-do-not-use-in-production
  GEMINI_API_KEY: ""

jobs:
  # ============================================================
  # Job 1: Python Lint & Type Check
  # ============================================================
  lint-python:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff lint
        run: ruff check mcp_sentinel/ scripts/ --output-format=github

      - name: Run ruff format check
        run: ruff format --check mcp_sentinel/ scripts/

  # ============================================================
  # Job 2: Backend Security Evaluation & Verification
  # ============================================================
  security-evaluation:
    name: Security Evaluation & Integrity Verification
    runs-on: ubuntu-latest
    needs: lint-python

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Initialize database schema
        run: python scripts/init_db.py
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Seed test data
        run: python scripts/seed_database.py
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Verify MCP Tool Discovery and Security Enforcements
        run: python scripts/manual_mcp_verification.py
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          APP_ENV: ${{ env.APP_ENV }}

      - name: Verify Human-in-the-Loop Approval Lifecycle and Anti-Replay
        run: python scripts/verify_console_flow.py
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          APP_ENV: ${{ env.APP_ENV }}
          ENABLE_TEST_AUTH: ${{ env.ENABLE_TEST_AUTH }}
          JWT_SECRET_KEY: ${{ env.JWT_SECRET_KEY }}

      - name: Verify database data integrity post-verification
        run: |
          python -c "
          import asyncio, asyncpg, os
          async def verify():
              conn = await asyncpg.connect(os.environ['DATABASE_URL'])
              customers = await conn.fetchval('SELECT count(*) FROM customers')
              audit_events = await conn.fetchval('SELECT count(*) FROM audit_events')
              print(f'Database integrity check: {customers} customers, {audit_events} audit events')
              assert audit_events > 0, 'Audit events must be recorded'
              await conn.close()
          asyncio.run(verify())
          "
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

  # ============================================================
  # Job 3: Security & Secret Scan
  # ============================================================
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt || echo "pip-audit completed"

      - name: Scan repository for unredacted secret patterns
        run: |
          python -c "
          import re, sys
          from pathlib import Path

          patterns = [
              (re.compile(r'AKIA[0-9A-Z]{16}'), 'AWS Access Key'),
              (re.compile(r'ghp_[0-9a-zA-Z]{36}'), 'GitHub Personal Access Token'),
              (re.compile(r'-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----'), 'Private Key'),
          ]

          violations = 0
          for p in Path('.').rglob('*'):
              if any(skip in p.parts for skip in ['.git', '.venv', 'node_modules', '__pycache__', '.pytest_cache', 'scratch', 'tests']):
                  continue
              if p.is_file() and p.stat().st_size < 1_000_000:
                  try:
                      content = p.read_text(encoding='utf-8', errors='ignore')
                      for pattern, desc in patterns:
                          if pattern.search(content):
                              print(f'::error file={p}::Potential {desc} detected in {p}')
                              violations += 1
                  except Exception:
                      pass
          if violations > 0:
              print(f'Secret scan failed: {violations} potential secrets found.')
              sys.exit(1)
          print('Secret scan passed: zero leaked credentials detected.')
          "


  # ============================================================
  # Job 4: Frontend Lint + Build
  # ============================================================
  build-frontend:
    name: Next.js Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Lint TypeScript / ESLint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"

  # ============================================================
  # Job 5: Docker Image Build Verification
  # ============================================================
  build-docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: [security-evaluation, build-frontend, security-audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: mcp-sentinel/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image (no push)
        uses: docker/build-push-action@v5
        with:
          context: web
          file: web/Dockerfile
          push: false
          tags: mcp-sentinel/web:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max
