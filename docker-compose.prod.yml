# ============================================================
# MCP-Sentinel – Production Container Composition (AWS EC2)
#
# Services:
#   api: FastAPI Security Gateway & Runtime (Local Docker Build)
#   web: Next.js Security Console (Local Docker Build)
#   proxy (optional profile 'tls-proxy'): Caddy TLS Reverse Proxy
#
# Database: Supabase PostgreSQL is hosted externally (never local in prod).
# Secrets: Injected via host environment or secure host .env (never baked in images).
# ============================================================

services:
  # ----------------------------------------------------------
  # FastAPI Backend API (MCP-Sentinel Core)
  # ----------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: mcp-sentinel-api:${IMAGE_TAG:-latest}
    container_name: sentinel-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: 8000
      MCP_SERVER_NAME: MCP-Sentinel
      MCP_SERVER_VERSION: 1.0.0
      DATABASE_URL: ${DATABASE_URL}
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-60}
      APPROVAL_HMAC_SECRET: ${APPROVAL_HMAC_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_HTTPONLY: "true"
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      ALLOWED_GOOGLE_DOMAINS: ${ALLOWED_GOOGLE_DOMAINS:-}
      ENABLE_TEST_AUTH: "false"
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI:-}
      NOTION_WRITE_ENABLED: ${NOTION_WRITE_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ALLOWED_CORS_ORIGINS: ${ALLOWED_CORS_ORIGINS:-["https://sentinel.yourdomain.com"]}
      FRONTEND_URL: ${FRONTEND_URL:-https://sentinel.yourdomain.com}
      BACKEND_URL: ${BACKEND_URL:-https://sentinel.yourdomain.com}
      APPROVAL_TICKET_TTL_SECONDS: ${APPROVAL_TICKET_TTL_SECONDS:-3600}
      TOOL_TIMEOUT_SECONDS: ${TOOL_TIMEOUT_SECONDS:-15.0}
    ports:
      - "${API_BIND_IP:-127.0.0.1}:${API_PORT:-8000}:8000"
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 850M
        reservations:
          cpus: "0.25"
          memory: 350M

  # ----------------------------------------------------------
  # Next.js Security Console Frontend
  # ----------------------------------------------------------
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    image: mcp-sentinel-web:${IMAGE_TAG:-latest}
    container_name: sentinel-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://sentinel.yourdomain.com}
      API_BASE_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${WEB_BIND_IP:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    networks:
      - sentinel-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: 650M
        reservations:
          cpus: "0.2"
          memory: 250M

  # ----------------------------------------------------------
  # Optional: Production Caddy Reverse Proxy with Automatic TLS
  # Enabled only with `--profile tls-proxy` (when not using AWS ALB)
  # ----------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: sentinel-caddy
    restart: unless-stopped
    profiles:
      - tls-proxy
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      DOMAIN: ${PRODUCTION_DOMAIN:-sentinel.yourdomain.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - sentinel-net
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

networks:
  sentinel-net:
    driver: bridge

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
